---
machine:
  time:
    servers:
      - time.cloudflare.com
      - pool.ntp.org
  nodeLabels:
    homelab/iot-gateway: "true"
  network:
    kubespan:
      enabled: false
      advertiseKubernetesNetworks: false
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: false

cluster:
  proxy:
    disabled: true
  network:
    cni:
      name: none
