---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "34.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  targetNamespace: traefik-system
  install:
    createNamespace: true
  values:
    service:
      type: LoadBalancer
    ports:
      web:
        exposedPort: 80
    ingressRoute:
      dashboard:
        enabled: false
    ingressClass:
      name: traefik
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
