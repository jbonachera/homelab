---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - timescaledb-credentials
      - gazpar2haws
      - jellyfin-db-credentials
      - prismedia-db-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: database
subjects:
  - kind: ServiceAccount
    name: eso-reader
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-reader
  apiGroup: rbac.authorization.k8s.io
