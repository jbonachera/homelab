---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubernetes-reader
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: database
      auth:
        serviceAccount:
          name: eso-reader
          namespace: external-secrets
