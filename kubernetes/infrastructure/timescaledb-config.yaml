---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: timescaledb-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/infrastructure/timescaledb-config
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: timescaledb
  healthChecks:
    - apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      name: timescaledb-credentials
      namespace: database
