---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-bt
  namespace: media
  annotations:
    # Stable IP so the UDM Pro port forward can target it
    lbipam.cilium.io/ips: "172.20.155.50"
spec:
  type: LoadBalancer
  # Preserve peer source IPs (no SNAT to node IP)
  externalTrafficPolicy: Local
  selector:
    app: qbittorrent
  ports:
    - name: bt-tcp
      port: 59477
      targetPort: 59477
      protocol: TCP
    - name: bt-udp
      port: 59477
      targetPort: 59477
      protocol: UDP
