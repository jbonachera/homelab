[env]
KUBECONFIG    = "{{config_root}}/tofu/bootstrap/kubeconfig.yaml"
TALOSCONFIG   = "{{config_root}}/tofu/bootstrap/talosconfig.yaml"

[tools]
opentofu = "latest"
talosctl = "latest"
kubectl  = "latest"
flux2    = "latest"
sops     = "latest"
age      = "latest"
hk       = "latest"
pipx                = "latest"
python              = "3.12"
"pipx:yamllint"     = "latest"
pkl = "latest"

[tasks.bootstrap]
description = "Provision Talos node — push machineconfig, bootstrap etcd, write kubeconfig"
run         = "tofu -chdir=tofu/bootstrap apply"

[tasks.bootstrap-plan]
description = "Preview Talos bootstrap changes without applying"
run         = "tofu -chdir=tofu/bootstrap plan"

[tasks.apply]
description = "Deploy operators onto an already-bootstrapped cluster"
run = [
  # Pass 1: install Cilium so its CRDs exist before the second pass
  "tofu -chdir=tofu/operators apply -target=helm_release.cilium -auto-approve",
  # Pass 2: full apply (CiliumLoadBalancerIPPool + CiliumL2AnnouncementPolicy + Traefik + rest)
  "tofu -chdir=tofu/operators apply",
]

[tasks.plan]
description = "Preview operator changes without applying"
run         = "tofu -chdir=tofu/operators plan"

[tasks.bootstrap-flux]
description = "Bootstrap Flux CD onto the cluster using current gh session token"
run         = """
export GITHUB_TOKEN=$(gh auth token)
flux bootstrap github \
  --owner=jbonachera \
  --repository=homelab \
  --branch=main \
  --path=kubernetes \
  --personal
"""

[tasks.reset]
description = "Wipe and reprovision the node — requires NODE_IP env var"
run         = "talosctl reset --reboot"
