# SOPS encryption configuration
#
# The age public key below is a PLACEHOLDER.
# Replace it with your real public key generated by:
#
#   age-keygen -o age.key
#
# The public key is printed to stdout and stored as a comment in age.key.
# Example output:  Public key: age1xxxx...
#
# The private key file (age.key) is gitignored and must stay local only.
# Only the public key (age1...) is safe to commit here.
creation_rules:
