---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        homelab/iot-gateway: "true"
      containers:
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:7.0.0
          args:
            - --storage-path
            - /data
            - --paa-root-cert-dir
            - /data/paa-root-certs
            - --port
            - "5580"
            - --listen-address
            - 0.0.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  selector:
    app: matter-server
  ports:
    - port: 5580
      targetPort: 5580
