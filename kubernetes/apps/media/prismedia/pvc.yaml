---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prismedia-library
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: prismedia-library
    namespace: media
  nfs:
    server: 172.20.2.150
    path: /var/nfs/shared/Partagé/Bibliotheque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prismedia-library
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Ti
  volumeName: prismedia-library
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prismedia-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
